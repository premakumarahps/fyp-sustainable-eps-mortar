<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="epsGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="shellGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Tile -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
  
  <!-- Outer C-S-H Needle Rays (Pozzolanic Gel Hydration) -->
  <g stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="14" x2="50" y2="24" />
    <line x1="78" y1="30" x2="70" y2="35" />
    <line x1="82" y1="62" x2="72" y2="58" />
    <line x1="50" y1="86" x2="50" y2="76" />
    <line x1="18" y1="62" x2="28" y2="58" />
    <line x1="22" y1="30" x2="30" y2="35" />
  </g>

  <!-- Encrusted PVAc/Sand Core-Shell Ring -->
  <circle cx="50" cy="50" r="26" fill="url(#shellGrad)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,2" />
  
  <!-- EPS Inner Polymer Bead Core -->
  <circle cx="50" cy="50" r="20" fill="url(#epsGrad)" filter="url(#glow)" />
  
  <!-- Polypropylene Micro-Fiber Bridging Line -->
  <path d="M 24,70 Q 50,44 76,28" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95" />
  <path d="M 28,32 Q 54,58 72,72" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,2" fill="none" opacity="0.75" />
</svg>
